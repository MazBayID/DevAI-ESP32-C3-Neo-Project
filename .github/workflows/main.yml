name: Neo Diagnostic ZIP Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          find . -maxdepth 3 -type f | sort

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP firmware tidak ditemukan di root repository."
            exit 1
          fi

          echo "Firmware ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Install ESP-IDF 5.5.2
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.2

      - name: Install ESP-IDF tools
        shell: bash
        run: |
          set -e

          python "$IDF_PATH/tools/idf_tools.py" install

          . "$IDF_PATH/export.sh"

          echo "ESP-IDF:"
          idf.py --version

      - name: Unzip firmware source
        shell: bash
        run: |
          set -e

          rm -rf neo-source
          mkdir -p neo-source

          echo "=== Unzipping ==="
          unzip -q "$ZIP_FILE" -d neo-source

          echo "=== Extracted files ==="
          find neo-source -maxdepth 5 -type f | sort

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/neo-source" \
            -name CMakeLists.txt \
            -type f \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: CMakeLists.txt tidak ditemukan."
            exit 1
          fi

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure ESP32-C3
        shell: bash
        run: |
          set -e

          . "$IDF_PATH/export.sh"

          cd "$PROJECT_DIR"

          echo "=== ESP-IDF TARGET ==="
          idf.py set-target esp32c3

      - name: Build firmware
        shell: bash
        run: |
          set -e

          . "$IDF_PATH/export.sh"

          cd "$PROJECT_DIR"

          echo "=== BUILD ==="
          idf.py build

      - name: Merge binary
        shell: bash
        run: |
          set -e

          . "$IDF_PATH/export.sh"

          cd "$PROJECT_DIR"

          echo "=== MERGE BIN ==="
          idf.py merge-bin

      - name: Prepare firmware artifacts
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp "$PROJECT_DIR/build/merged-binary.bin" \
            artifacts/neo-diagnostic-merged.bin

          cp "$PROJECT_DIR/build/bootloader/bootloader.bin" \
            artifacts/bootloader.bin

          cp "$PROJECT_DIR/build/partition_table/partition-table.bin" \
            artifacts/partition-table.bin

          cp "$PROJECT_DIR/build/neo_diagnostic.bin" \
            artifacts/neo-diagnostic.bin

          printf '%s\n' \
            '========================================' \
            'NEO DIAGNOSTIC v1.0' \
            '========================================' \
            'Target: ESP32-C3' \
            'ESP-IDF: v5.5.2' \
            '' \
            'FLASH:' \
            'neo-diagnostic-merged.bin -> 0x00000000' \
            '' \
            'OLED:' \
            'SDA GPIO21' \
            'SCL GPIO20' \
            '' \
            'INMP441:' \
            'BCLK GPIO2' \
            'WS GPIO1' \
            'SD GPIO8' \
            '' \
            'MAX98357A:' \
            'BCLK GPIO2' \
            'LRC GPIO1' \
            'DIN GPIO3' \
            '' \
            'BLE: DISABLED' \
            '========================================' \
            > artifacts/FLASH_INFO.txt

          echo "=== ARTIFACTS ==="
          ls -lh artifacts

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Diagnostic-v1.0
          path: artifacts/
          if-no-files-found: error
