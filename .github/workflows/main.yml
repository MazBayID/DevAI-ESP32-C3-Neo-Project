name: Build Neo Pocket AI - ESP-IDF 5.5.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  IDF_VERSION: v5.5.2
  IDF_TARGET: esp32c3

jobs:
  build:
    name: ESP-IDF 5.5.2 / ESP32-C3
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Install ESP-IDF 5.5.2
      # =========================================================
      - name: Install ESP-IDF 5.5.2
        uses: espressif/install-esp-idf-action@v1
        with:
          version: ${{ env.IDF_VERSION }}
          target: ${{ env.IDF_TARGET }}

      # =========================================================
      # 3. Verify ESP-IDF installation
      # =========================================================
      - name: Verify ESP-IDF
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ESP-IDF VERSION"
          echo "========================================"

          idf.py --version

          echo
          echo "IDF_PATH=$IDF_PATH"
          echo "IDF_TARGET=$IDF_TARGET"

          echo
          echo "========================================"
          echo "ESP-IDF ENVIRONMENT"
          echo "========================================"

          python --version
          cmake --version
          ninja --version

      # =========================================================
      # 4. Show repository
      # =========================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"

          find . -maxdepth 4 -type f | sort

      # =========================================================
      # 5. Prepare Neo project directory
      #
      # The repository may contain:
      #
      # firmware/
      # .github/
      # README.md
      #
      # This step creates a clean ESP-IDF project workspace.
      # =========================================================
      - name: Prepare ESP-IDF project
        shell: bash
        run: |
          set -e

          rm -rf neo-build-project

          mkdir -p neo-build-project/main
          mkdir -p neo-build-project/components

          echo "ESP-IDF project directory created."

      # =========================================================
      # 6. Check firmware source
      # =========================================================
      - name: Check Neo firmware
        shell: bash
        run: |
          set -e

          if [ ! -f "firmware/Neo_Pocket_AI.ino" ]; then
            echo "ERROR: firmware/Neo_Pocket_AI.ino not found."
            exit 1
          fi

          cp firmware/Neo_Pocket_AI.ino \
             neo-build-project/main/Neo_Pocket_AI.ino

          echo "Firmware copied."

      # =========================================================
      # 7. Create ESP-IDF project files
      # =========================================================
      - name: Create ESP-IDF project configuration
        shell: bash
        run: |
          set -e

          cat > neo-build-project/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)

          include($ENV{IDF_PATH}/tools/cmake/project.cmake)

          project(neo_pocket_ai)
          EOF

          cat > neo-build-project/main/CMakeLists.txt <<'EOF'
          idf_component_register(
              SRCS
                  "main.cpp"
              INCLUDE_DIRS
                  "."
          )
          EOF

          cat > neo-build-project/sdkconfig.defaults <<'EOF'
          CONFIG_IDF_TARGET="esp32c3"
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG_ESPTOOLPY_FLASHSIZE="4MB"
          EOF

          echo "ESP-IDF configuration created."

      # =========================================================
      # 8. IMPORTANT:
      #    Arduino-ESP32 component
      #
      #    This repository will be cloned into components/arduino.
      #    We pin it to the Arduino-ESP32 branch compatible with
      #    the ESP-IDF generation used here.
      # =========================================================
      - name: Install Arduino-ESP32 component
        shell: bash
        working-directory: neo-build-project
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch 3.3.7 \
            https://github.com/espressif/arduino-esp32.git \
            components/arduino

          echo "Arduino-ESP32 component installed."

      # =========================================================
      # 9. Install required Arduino libraries
      #
      # These libraries are used by the current OLED firmware.
      # =========================================================
      - name: Install Arduino libraries
        shell: bash
        run: |
          set -e

          mkdir -p neo-build-project/components

          git clone \
            --depth 1 \
            https://github.com/adafruit/Adafruit-GFX-Library.git \
            neo-build-project/components/Adafruit-GFX-Library

          git clone \
            --depth 1 \
            https://github.com/adafruit/Adafruit_SSD1306.git \
            neo-build-project/components/Adafruit_SSD1306

          echo "Arduino libraries installed."

      # =========================================================
      # 10. Convert .ino -> main.cpp
      #
      # We add the Arduino include and the Arduino component
      # initialization wrapper.
      # =========================================================
      - name: Generate main.cpp
        shell: bash
        run: |
          set -e

          {
            echo '#include <Arduino.h>'
            echo '#include <Wire.h>'
            echo '#include <Adafruit_GFX.h>'
            echo '#include <Adafruit_SSD1306.h>'
            echo
            echo '#include "Neo_Pocket_AI.ino"'
            echo
            echo 'extern "C" void app_main(void)'
            echo '{'
            echo '    initArduino();'
            echo '    setup();'
            echo
            echo '    while (true)'
            echo '    {'
            echo '        loop();'
            echo '        delay(1);'
            echo '    }'
            echo '}'
          } > neo-build-project/main/main.cpp

          echo "main.cpp generated."

      # =========================================================
      # 11. Build
      # =========================================================
      - name: Configure ESP32-C3
        working-directory: neo-build-project
        shell: bash
        run: |
          set -e

          idf.py set-target esp32c3

      - name: Build firmware
        working-directory: neo-build-project
        shell: bash
        run: |
          set -e

          idf.py build

      # =========================================================
      # 12. Display build output
      # =========================================================
      - name: List build files
        working-directory: neo-build-project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"

          find build -maxdepth 3 -type f | sort

      # =========================================================
      # 13. Merge binaries
      #
      # Result:
      #
      # build/neo_pocket_ai-merged.bin
      #
      # This contains the bootloader, partition table,
      # application and configured partitions at their
      # correct flash offsets.
      # =========================================================
      - name: Merge firmware into one BIN
        working-directory: neo-build-project
        shell: bash
        run: |
          set -e

          idf.py merge-bin \
            -o build/neo_pocket_ai-merged.bin

      # =========================================================
      # 14. Verify merged binary
      # =========================================================
      - name: Verify merged BIN
        working-directory: neo-build-project
        shell: bash
        run: |
          set -e

          if [ ! -f "build/neo_pocket_ai-merged.bin" ]; then
            echo "ERROR: merged BIN was not created."
            exit 1
          fi

          ls -lh build/neo_pocket_ai-merged.bin

          echo
          echo "Merged firmware created successfully."

      # =========================================================
      # 15. Generate flash information
      # =========================================================
      - name: Generate flash information
        working-directory: neo-build-project
        shell: bash
        run: |
          set -e

          {
            echo "Neo Pocket AI"
            echo "ESP-IDF: $IDF_VERSION"
            echo "Target: $IDF_TARGET"
            echo
            echo "Merged firmware:"
            echo "neo_pocket_ai-merged.bin"
            echo
            echo "For a normal ESP-IDF flash layout, the merged BIN"
            echo "is intended to start at flash address 0x0."
          } > build/FLASH_INFO.txt

          cat build/FLASH_INFO.txt

      # =========================================================
      # 16. Upload final firmware artifacts
      # =========================================================
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Pocket-AI-ESP32-C3-ESP-IDF-5.5.2
          if-no-files-found: error
          path: |
            neo-build-project/build/neo_pocket_ai-merged.bin
            neo-build-project/build/neo_pocket_ai.bin
            neo-build-project/build/bootloader/bootloader.bin
            neo-build-project/build/partition_table/partition-table.bin
            neo-build-project/build/FLASH_INFO.txt
            neo-build-project/build/flasher_args.json
            neo-build-project/build/project_description.json
