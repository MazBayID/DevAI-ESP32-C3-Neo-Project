name: Neo Diagnostic ZIP Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find firmware ZIP
        shell: bash
        run: |
          set -e

          echo "=== ROOT REPOSITORY ==="
          find . -maxdepth 3 -type f | sort

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada ZIP di root repository."
            exit 1
          fi

          echo "ZIP utama:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Install ESP-IDF 5.5.2
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.2

      - name: Install ESP-IDF tools
        shell: bash
        run: |
          set -e

          python "$IDF_PATH/tools/idf_tools.py" install

          . "$IDF_PATH/export.sh"

          idf.py --version

      - name: Extract firmware ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/neo-source"
          mkdir -p "$GITHUB_WORKSPACE/neo-source"

          echo "=== EXTRACT LEVEL 1 ==="

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/neo-source"

          echo "=== FILES AFTER LEVEL 1 ==="

          find "$GITHUB_WORKSPACE/neo-source" \
            -maxdepth 5 \
            -type f \
            | sort

          # Cari langsung CMakeLists.txt
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/neo-source" \
            -name CMakeLists.txt \
            -type f \
            -print \
            -quit \
            | xargs -r dirname)"

          # Kalau belum ditemukan, cari ZIP kedua.
          if [ -z "$PROJECT_DIR" ]; then

            echo "CMakeLists belum ditemukan."
            echo "Mencari ZIP kedua..."

            INNER_ZIP="$(find "$GITHUB_WORKSPACE/neo-source" \
              -type f \
              -iname '*.zip' \
              -print \
              -quit)"

            if [ -z "$INNER_ZIP" ]; then
              echo "ERROR: ZIP kedua tidak ditemukan."
              exit 1
            fi

            echo "ZIP kedua:"
            echo "$INNER_ZIP"

            mkdir -p "$GITHUB_WORKSPACE/neo-source/inner"

            unzip -q "$INNER_ZIP" \
              -d "$GITHUB_WORKSPACE/neo-source/inner"

            echo "=== FILES AFTER LEVEL 2 ==="

            find "$GITHUB_WORKSPACE/neo-source/inner" \
              -maxdepth 6 \
              -type f \
              | sort

            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/neo-source/inner" \
              -name CMakeLists.txt \
              -type f \
              -print \
              -quit \
              | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: CMakeLists.txt tetap tidak ditemukan."
            echo "Struktur hasil ekstraksi:"
            find "$GITHUB_WORKSPACE/neo-source" \
              -maxdepth 8 \
              -print \
              | sort
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "PROJECT DITEMUKAN"
          echo "$PROJECT_DIR"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure ESP32-C3
        shell: bash
        run: |
          set -e

          . "$IDF_PATH/export.sh"

          cd "$PROJECT_DIR"

          echo "=== SET TARGET ESP32-C3 ==="

          idf.py set-target esp32c3

      - name: Build firmware
        shell: bash
        run: |
          set -e

          . "$IDF_PATH/export.sh"

          cd "$PROJECT_DIR"

          echo "=== BUILD NEO DIAGNOSTIC ==="

          idf.py build

      - name: Merge binary
        shell: bash
        run: |
          set -e

          . "$IDF_PATH/export.sh"

          cd "$PROJECT_DIR"

          echo "=== MERGE BINARY ==="

          idf.py merge-bin

      - name: Prepare artifacts
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$PROJECT_DIR/build/merged-binary.bin" \
            "$GITHUB_WORKSPACE/artifacts/neo-diagnostic-merged.bin"

          cp "$PROJECT_DIR/build/bootloader/bootloader.bin" \
            "$GITHUB_WORKSPACE/artifacts/bootloader.bin"

          cp "$PROJECT_DIR/build/partition_table/partition-table.bin" \
            "$GITHUB_WORKSPACE/artifacts/partition-table.bin"

          cp "$PROJECT_DIR/build/neo_diagnostic.bin" \
            "$GITHUB_WORKSPACE/artifacts/neo-diagnostic.bin"

          printf '%s\n' \
            '========================================' \
            'NEO DIAGNOSTIC v1.0' \
            '========================================' \
            'Target: ESP32-C3' \
            'ESP-IDF: v5.5.2' \
            '' \
            'FLASH:' \
            'neo-diagnostic-merged.bin -> 0x00000000' \
            '' \
            'OLED:' \
            'SDA GPIO21' \
            'SCL GPIO20' \
            '' \
            'INMP441:' \
            'BCLK GPIO2' \
            'WS GPIO1' \
            'SD GPIO8' \
            '' \
            'MAX98357A:' \
            'BCLK GPIO2' \
            'LRC GPIO1' \
            'DIN GPIO3' \
            '' \
            'BLE: DISABLED' \
            '========================================' \
            > "$GITHUB_WORKSPACE/artifacts/FLASH_INFO.txt"

          echo "=== ARTIFACTS ==="

          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Diagnostic-v1.0
          path: artifacts/
          if-no-files-found: error
