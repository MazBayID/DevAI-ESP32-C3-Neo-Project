name: Build Neo Diagnostic v1.0

on:
  workflow_dispatch:
  push:
    paths:
      - "Neo-Diagnostic-v1.0-SINGLE.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ESP-IDF 5.5.2
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.2

      - name: Install ESP-IDF Tools
        shell: bash
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install
          . "$IDF_PATH/export.sh"

      - name: Unzip Neo Diagnostic
        shell: bash
        run: |
          set -e

          echo "=== ZIP YANG DITEMUKAN ==="
          ls -lh *.zip

          rm -rf neo-source
          mkdir -p neo-source

          echo "=== EXTRACT Neo-Diagnostic-v1.0-SINGLE.zip ==="
          unzip -q "Neo-Diagnostic-v1.0-SINGLE.zip" -d neo-source

          echo "=== HASIL EXTRACT ==="
          find neo-source -maxdepth 4 -type f | sort

          echo "=== MENCARI CMakeLists.txt ==="
          CMAKE_FILE=$(find neo-source -name CMakeLists.txt -type f | head -n 1)

          if [ -z "$CMAKE_FILE" ]; then
            echo "ERROR: CMakeLists.txt tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$CMAKE_FILE")

          echo "CMakeLists ditemukan:"
          echo "$CMAKE_FILE"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build ESP32-C3
        shell: bash
        run: |
          set -e

          . "$IDF_PATH/export.sh"

          echo "=== PROJECT DIRECTORY ==="
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "=== SET TARGET ESP32-C3 ==="
          idf.py set-target esp32c3

          echo "=== BUILD ==="
          idf.py build

          echo "=== MERGE BIN ==="
          idf.py merge-bin

      - name: Collect Firmware
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp "$PROJECT_DIR/build/Neo-Diagnostic-v1.0.bin" \
             artifacts/

          cp "$PROJECT_DIR/build/bootloader/bootloader.bin" \
             artifacts/

          cp "$PROJECT_DIR/build/partition_table/partition-table.bin" \
             artifacts/

          cp "$PROJECT_DIR/build/flasher_args.json" \
             artifacts/

          echo "=== FIRMWARE HASIL BUILD ==="
          ls -lh artifacts/

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Diagnostic-v1.0-FIRMWARE
          path: artifacts/
