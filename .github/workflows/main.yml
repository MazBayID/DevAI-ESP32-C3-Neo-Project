name: Build Neo Pocket AI v0.2

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  IDF_VERSION: "v5.5.2"
  IDF_TARGET: "esp32c3"
  ZIP_FILE: "Neo-Pocket-AI-v0.2.zip"

jobs:
  build:
    name: ESP32-C3 ESP-IDF 5.5.2
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        shell: bash
        run: |
          set -e

          echo "Checking ZIP..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE tidak ditemukan."
            echo
            echo "Repository contents:"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting $ZIP_FILE..."

          unzip -q "$ZIP_FILE" -d extracted

          echo
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | sort

      - name: Find ESP-IDF project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find extracted \
            -type f \
            -name CMakeLists.txt \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: CMakeLists.txt tidak ditemukan."
            exit 1
          fi

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: ${{ env.IDF_VERSION }}
          target: ${{ env.IDF_TARGET }}

      - name: Check ESP-IDF
        shell: bash
        run: |
          set -e

          echo "IDF_PATH=$IDF_PATH"

          idf.py --version
          python --version
          cmake --version
          ninja --version
          esptool version

      - name: Build ESP32-C3
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat project_dir.txt)"

          cd "$PROJECT_DIR"

          echo "Setting target..."

          idf.py set-target esp32c3

          echo "Building..."

          idf.py build

      - name: Show build files
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat project_dir.txt)"

          cd "$PROJECT_DIR"

          echo "===== BUILD FILES ====="

          find build -maxdepth 4 -type f | sort

          echo
          echo "===== BIN FILES ====="

          find build -name "*.bin" -type f -exec ls -lh {} \;

      - name: Merge firmware
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat project_dir.txt)"

          cd "$PROJECT_DIR"

          mkdir -p release

          echo "Merging firmware..."

          idf.py merge-bin \
            -o release/neo_pocket_ai-merged.bin

          echo
          echo "Merged BIN:"

          ls -lh release/neo_pocket_ai-merged.bin

      - name: Create flash information
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(cat project_dir.txt)"

          cd "$PROJECT_DIR"

          cat > release/FLASH_INFO.txt <<'EOF'
Neo Pocket AI v0.2

Target:
ESP32-C3

ESP-IDF:
5.5.2

Merged firmware:
neo_pocket_ai-merged.bin

Flash address:
0x00000000

Hardware mapping:

OLED
SDA = GPIO21
SCL = GPIO20

INMP441
SCK = GPIO2
WS  = GPIO1
SD  = GPIO8

MAX98357A
DIN  = GPIO3
BCLK = GPIO2
LRC  = GPIO1

Switch:
Not used
EOF

          cat release/FLASH_INFO.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Pocket-AI-v0.2-ESP32-C3
          if-no-files-found: error
          path: |
            extracted/**/release/neo_pocket_ai-merged.bin
            extracted/**/release/FLASH_INFO.txt
