name: Build Neo Pocket AI v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL ESP-IDF
      # ============================================================
      - name: Install ESP-IDF 5.5.2
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.2


      # ============================================================
      # 3. INSTALL ESP-IDF TOOLS
      # ============================================================
      - name: Install ESP-IDF tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ESP-IDF TOOL INSTALLATION"
          echo "=========================================="

          echo "IDF_PATH=$IDF_PATH"

          python "$IDF_PATH/tools/idf_tools.py" install

          echo
          echo "=== ESP-IDF VERSION ==="

          . "$IDF_PATH/export.sh"

          idf.py --version


      # ============================================================
      # 4. CHECK ZIP
      # ============================================================
      - name: Check Neo Pocket AI ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./Neo-Pocket-AI-v0.2.zip"

          echo "=========================================="
          echo "CHECKING NEO POCKET AI ZIP"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo
            echo "ERROR:"
            echo "$ZIP_FILE was not found."
            echo
            echo "Repository contents:"
            ls -lah
            exit 1
          fi

          echo
          echo "Using:"
          echo "$ZIP_FILE"

          echo
          echo "=== ZIP INTEGRITY TEST ==="

          unzip -t "$ZIP_FILE"


      # ============================================================
      # 5. EXTRACT ZIP
      # ============================================================
      - name: Extract Neo Pocket AI source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING NEO POCKET AI SOURCE"
          echo "=========================================="

          rm -rf neo-source
          mkdir -p neo-source

          unzip -q \
            "./Neo-Pocket-AI-v0.2.zip" \
            -d neo-source

          echo
          echo "=== EXTRACTED FILES ==="

          find neo-source \
            -maxdepth 5 \
            -type f \
            | sort


      # ============================================================
      # 6. LOCATE ESP-IDF PROJECT
      # ============================================================
      - name: Locate ESP-IDF project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LOCATING ESP-IDF PROJECT"
          echo "=========================================="

          CMAKE_FILE=$(find \
            neo-source \
            -name CMakeLists.txt \
            -type f \
            | head -n 1)

          if [ -z "$CMAKE_FILE" ]; then
            echo
            echo "ERROR:"
            echo "CMakeLists.txt was not found."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$CMAKE_FILE")

          echo
          echo "Project directory:"
          echo "$SOURCE_DIR"

          echo "$SOURCE_DIR" > project_dir.txt


      # ============================================================
      # 7. INSPECT PROJECT
      # ============================================================
      - name: Inspect Neo project
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(cat project_dir.txt)

          echo "=========================================="
          echo "NEO PROJECT FILES"
          echo "=========================================="

          find "$SOURCE_DIR" \
            -maxdepth 5 \
            -type f \
            | sort


      # ============================================================
      # 8. BUILD
      # ============================================================
      - name: Build ESP32-C3 firmware
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(cat project_dir.txt)

          echo "=========================================="
          echo "ACTIVATING ESP-IDF"
          echo "=========================================="

          . "$IDF_PATH/export.sh"

          echo
          echo "ESP-IDF version:"
          idf.py --version

          echo
          echo "=========================================="
          echo "SETTING TARGET: ESP32-C3"
          echo "=========================================="

          cd "$SOURCE_DIR"

          idf.py set-target esp32c3

          echo
          echo "=========================================="
          echo "BUILDING NEO POCKET AI"
          echo "=========================================="

          idf.py build


      # ============================================================
      # 9. INSPECT BUILD
      # ============================================================
      - name: Inspect build output
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(cat project_dir.txt)

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          find build \
            -maxdepth 3 \
            -type f \
            | sort

          echo
          echo "=== BIN FILES ==="

          find build \
            -maxdepth 3 \
            -type f \
            -name "*.bin" \
            -exec ls -lh {} \;


      # ============================================================
      # 10. CREATE MERGED BIN
      # ============================================================
      - name: Create merged firmware
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(cat project_dir.txt)

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "CREATING MERGED FIRMWARE"
          echo "=========================================="

          . "$IDF_PATH/export.sh"

          idf.py merge-bin

          echo
          echo "=== MERGED BIN ==="

          find build \
            -maxdepth 1 \
            -type f \
            -name "*-merged.bin" \
            -exec ls -lh {} \;


      # ============================================================
      # 11. COLLECT FIRMWARE
      # ============================================================
      - name: Collect firmware
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(cat project_dir.txt)

          cd "$SOURCE_DIR"

          echo "=========================================="
          echo "COLLECTING FIRMWARE"
          echo "=========================================="

          rm -rf artifacts
          mkdir -p artifacts

          MERGED=$(find \
            build \
            -maxdepth 1 \
            -type f \
            -name "*-merged.bin" \
            | head -n 1)

          if [ -n "$MERGED" ]; then

            echo
            echo "Merged firmware:"
            echo "$MERGED"

            cp "$MERGED" \
              artifacts/neo_pocket_ai-v0.2-merged.bin

          else

            echo
            echo "WARNING:"
            echo "Merged BIN was not found."

          fi

          echo
          echo "Copying individual BIN files..."

          find build \
            -maxdepth 3 \
            -type f \
            -name "*.bin" \
            -exec cp {} artifacts/ \;

          echo
          echo "=== ARTIFACTS ==="

          ls -lah artifacts

          if ! find artifacts \
            -type f \
            -name "*.bin" \
            | grep -q .; then

            echo
            echo "ERROR:"
            echo "No firmware BIN files were produced."

            exit 1
          fi


      # ============================================================
      # 12. CREATE FLASH INFO
      # ============================================================
      - name: Create FLASH_INFO.txt
        shell: bash
        run: |
          set -e

          SOURCE_DIR=$(cat project_dir.txt)

          cd "$SOURCE_DIR"

          printf '%s\n' \
            'Neo Pocket AI v0.2' \
            '' \
            'Target: ESP32-C3' \
            'ESP-IDF: v5.5.2' \
            '' \
            'Merged firmware address: 0x00000000' \
            '' \
            'OLED:' \
            'SDA = GPIO21' \
            'SCL = GPIO20' \
            '' \
            'INMP441:' \
            'SCK = GPIO2' \
            'WS = GPIO1' \
            'SD = GPIO8' \
            '' \
            'MAX98357A:' \
            'DIN = GPIO3' \
            'BCLK = GPIO2' \
            'LRC = GPIO1' \
            '' \
            'Switch: Not used' \
            > artifacts/FLASH_INFO.txt

          echo
          echo "=== FLASH INFO ==="

          cat artifacts/FLASH_INFO.txt


      # ============================================================
      # 13. UPLOAD
      # ============================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Pocket-AI-v0.2-ESP32-C3
          path: |
            neo-source/**/artifacts/
          if-no-files-found: error
